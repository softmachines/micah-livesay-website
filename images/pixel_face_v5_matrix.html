img.onload = () => {
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  octx.drawImage(img, 0, 0, W, H);
  const imageData = octx.getImageData(0,0,W,H);
  const pixels = imageData.data;

  const BS = 5;
  const COLS = Math.floor(W / BS);
  const ROWS = Math.floor(H / BS);

  // Rain drops per column
  const drops = Array.from({length: COLS}, (_,i) => ({
    col: i,
    y: -Math.random() * ROWS * 2, // stagger starts
    speed: 0.3 + Math.random() * 0.5,
    trail: 6 + Math.floor(Math.random()*6),
  }));

  // Track which cells are "revealed"
  const revealed = new Uint8Array(COLS * ROWS);

  let t = 0;
  function draw() {
    t += 0.016;
    ctx.fillStyle='rgba(0,0,0,0.18)';
    ctx.fillRect(0,0,W,H);

    for (const drop of drops) {
      drop.y += drop.speed;

      // Draw trail of bright head then fading pixels
      for (let j = 0; j < drop.trail; j++) {
        const ry = Math.floor(drop.y) - j;
        if (ry < 0 || ry >= ROWS) continue;
        const rx = drop.col;
        const pi = (ry*BS*W + rx*BS)*4;
        const r=pixels[pi],g=pixels[pi+1],b=pixels[pi+2];
        const bright = (r+g+b)/3;

        if (j === 0) {
          // Head: white flash
          ctx.fillStyle = `rgba(255,255,255,0.9)`;
          revealed[ry*COLS+rx] = 1;
        } else {
          // Trail: image color fading
          const fa = Math.max(0, 1 - j/drop.trail);
          ctx.fillStyle = `rgba(${r},${g},${b},${fa*0.9})`;
        }
        ctx.fillRect(rx*BS, ry*BS, BS-1, BS-1);
      }

      // Reset when off screen - loop
      if (drop.y > ROWS + drop.trail) {
        drop.y = -Math.random() * ROWS;
        drop.speed = 0.3 + Math.random()*0.5;
      }
    }

    // Draw fully revealed pixels
    for (let ry = 0; ry < ROWS; ry++) {
      for (let rx = 0; rx < COLS; rx++) {
        if (!revealed[ry*COLS+rx]) continue;
        const pi = (ry*BS*W + rx*BS)*4;
        const r=pixels[pi],g=pixels[pi+1],b=pixels[pi+2],a=pixels[pi+3];
        if (a<20) continue;
        const flicker = 0.85 + 0.15*Math.sin(t*3 + rx*0.3 + ry*0.2);
        ctx.fillStyle = `rgba(${r},${g},${b},${flicker})`;
        ctx.fillRect(rx*BS, ry*BS, BS-1, BS-1);
      }
    }

    ctx.fillStyle='rgba(0,0,0,0.07)';
    for(let s=0;s<H;s+=4) ctx.fillRect(0,s,W,1);

    requestAnimationFrame(draw);
  }
  draw();
};
