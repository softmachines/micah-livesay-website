<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ASCII // LOADING INDICATORS</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
    --green: #00ff41; --gdim: #00b32c; --gdark: #003d0f;
    --pink: #ff2d78;  --cyan: #00ffcc; --bg: #010802; --panel: #060e07;
}
*{ margin:0; padding:0; box-sizing:border-box; }
html,body{
    min-height:100%; background:var(--bg);
    font-family:'Share Tech Mono',monospace; color:var(--green);
}
h1{
    text-align:center; padding:28px 0 20px;
    font-size:14px; letter-spacing:4px;
    color:var(--pink); text-shadow:0 0 12px rgba(255,45,120,.5);
    border-bottom:1px solid var(--gdark);
}
h1 span{ color:var(--gdark); }
.grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:1px; background:var(--gdark);
    border:1px solid var(--gdark);
    margin:24px;
}
.card{
    background:var(--panel);
    padding:28px 20px 20px;
    display:flex; flex-direction:column; align-items:center; gap:14px;
    min-height:240px;
}
.card-label{
    font-size:10px; letter-spacing:3px;
    color:var(--gdark); text-align:center;
}
.card-title{
    font-size:11px; letter-spacing:2px;
    color:var(--gdim); text-align:center;
}
.anim{
    font-family:'Share Tech Mono',monospace;
    font-size:13px; line-height:1.7;
    color:var(--green);
    text-shadow:0 0 6px rgba(0,255,65,.4);
    text-align:center;
    white-space:pre;
    flex:1; display:flex; align-items:center; justify-content:center;
}
.anim.pink { color:var(--pink); text-shadow:0 0 6px rgba(255,45,120,.4); }
.anim.cyan { color:var(--cyan); text-shadow:0 0 6px rgba(0,255,204,.4); }

/* Responsive */
@media(max-width:900px){ .grid{ grid-template-columns:repeat(2,1fr); } }
@media(max-width:500px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>

<h1>ASCII <span>//</span> LOADING INDICATORS</h1>

<div class="grid">

    <!-- 1 — BLOCK FILL BAR -->
    <div class="card">
        <div class="card-title">BLOCK FILL</div>
        <div class="anim" id="a1"></div>
        <div class="card-label">BARS</div>
    </div>

    <!-- 2 — GRADIENT DENSITY BAR -->
    <div class="card">
        <div class="card-title">DENSITY GRADIENT</div>
        <div class="anim" id="a2"></div>
        <div class="card-label">BARS</div>
    </div>

    <!-- 3 — SCANNER BAR -->
    <div class="card">
        <div class="card-title">SCANNER PULSE</div>
        <div class="anim" id="a3"></div>
        <div class="card-label">BARS</div>
    </div>

    <!-- 4 — WAVEFORM BAR -->
    <div class="card">
        <div class="card-title">WAVEFORM FILL</div>
        <div class="anim" id="a4"></div>
        <div class="card-label">BARS</div>
    </div>

    <!-- 5 — BRAILLE ORBIT SPINNER -->
    <div class="card">
        <div class="card-title">ORBIT SPINNER</div>
        <div class="anim cyan" id="a5"></div>
        <div class="card-label">ANIMATION</div>
    </div>

    <!-- 6 — MATRIX RAIN -->
    <div class="card">
        <div class="card-title">SIGNAL CASCADE</div>
        <div class="anim" id="a6"></div>
        <div class="card-label">ANIMATION</div>
    </div>

    <!-- 7 — RADAR SWEEP -->
    <div class="card">
        <div class="card-title">RADAR SWEEP</div>
        <div class="anim cyan" id="a7"></div>
        <div class="card-label">ANIMATION</div>
    </div>

    <!-- 8 — PULSE RINGS -->
    <div class="card">
        <div class="card-title">PULSE RINGS</div>
        <div class="anim pink" id="a8"></div>
        <div class="card-label">ANIMATION</div>
    </div>

</div>

<script>
// ─── 1. BLOCK FILL BAR ──────────────────────────────────────────
(function() {
    const el = document.getElementById('a1');
    const W  = 24;
    let pct = 0, dir = 1;
    function tick() {
        pct = Math.max(0, Math.min(100, pct + dir * 1.1));
        if (pct >= 100) dir = -1;
        if (pct <= 0)   dir =  1;
        const n   = Math.round(W * pct / 100);
        const bar = '█'.repeat(n) + '░'.repeat(W - n);
        const num = String(Math.round(pct)).padStart(3);
        el.textContent =
            '┌' + '─'.repeat(W + 2) + '┐\n' +
            '│ ' + bar + ' │\n' +
            '└' + '─'.repeat(W + 2) + '┘\n' +
            '       ' + num + '%';
    }
    setInterval(tick, 45);
    tick();
})();

// ─── 2. DENSITY GRADIENT BAR ────────────────────────────────────
(function() {
    const el = document.getElementById('a2');
    const W  = 24;
    const D  = ' ░▒▓█';
    let pct = 0, dir = 1;
    function tick() {
        pct = Math.max(0, Math.min(100, pct + dir * 0.9));
        if (pct >= 100) dir = -1;
        if (pct <= 0)   dir =  1;
        let bar = '';
        for (let i = 0; i < W; i++) {
            const pos = (i / W) * 100;
            if      (pos <= pct - 9) bar += '█';
            else if (pos <= pct - 6) bar += '▓';
            else if (pos <= pct - 3) bar += '▒';
            else if (pos <= pct)     bar += '░';
            else                     bar += ' ';
        }
        const num = String(Math.round(pct)).padStart(3);
        el.textContent =
            ' ┌' + '─'.repeat(W) + '┐\n' +
            ' │' + bar           + '│\n' +
            ' └' + '─'.repeat(W) + '┘\n' +
            '       ' + num + '%';
    }
    setInterval(tick, 55);
    tick();
})();

// ─── 3. SCANNER PULSE BAR ───────────────────────────────────────
(function() {
    const el = document.getElementById('a3');
    const W  = 26;
    const SW = 6;
    let pos = 0, dir = 1;
    function tick() {
        pos = Math.max(0, Math.min(W - SW, pos + dir * 0.35));
        if (pos >= W - SW) dir = -1;
        if (pos <= 0)      dir =  1;
        let bar = '';
        for (let i = 0; i < W; i++) {
            const d = Math.abs(i - (pos + SW * 0.5));
            const b = Math.max(0, 1 - d / (SW * 0.5));
            if      (b > 0.85) bar += '█';
            else if (b > 0.6)  bar += '▓';
            else if (b > 0.35) bar += '▒';
            else if (b > 0.1)  bar += '░';
            else               bar += '·';
        }
        el.textContent =
            '  ╔' + '═'.repeat(W) + '╗\n' +
            '  ║' + bar           + '║\n' +
            '  ╚' + '═'.repeat(W) + '╝\n' +
            '       SCANNING · · ·';
    }
    setInterval(tick, 28);
    tick();
})();

// ─── 4. WAVEFORM FILL BAR ───────────────────────────────────────
(function() {
    const el = document.getElementById('a4');
    const W  = 24;
    const HC = ' ▁▂▃▄▅▆▇█';
    let phase = 0, pct = 0, dir = 1;
    function tick() {
        phase += 0.18;
        pct = Math.max(0, Math.min(100, pct + dir * 0.8));
        if (pct >= 100) dir = -1;
        if (pct <= 0)   dir =  1;
        // Two rows of waveform
        let top = '', bot = '';
        for (let i = 0; i < W; i++) {
            const pos = (i / W) * 100;
            if (pos > pct) { top += ' '; bot += ' '; continue; }
            const v1 =  Math.sin(phase + i * 0.45) * 0.5 + 0.5;
            const v2 = -Math.sin(phase + i * 0.45) * 0.5 + 0.5;
            top += HC[Math.floor(v1 * (HC.length - 1))];
            bot += HC[Math.floor(v2 * (HC.length - 1))];
        }
        const num = String(Math.round(pct)).padStart(3);
        el.textContent =
            '▐' + top + '▌\n' +
            '▐' + bot + '▌\n' +
            '  ' + '─'.repeat(W) + '\n' +
            '       ' + num + '%';
    }
    setInterval(tick, 45);
    tick();
})();

// ─── 5. ORBIT SPINNER ───────────────────────────────────────────
(function() {
    const el = document.getElementById('a5');
    // 8 positions around a circle (x, y offsets in char grid, 2:1 aspect)
    const CX = 7, CY = 4; // center
    const RX = 5, RY = 2; // radius x, y
    const RING = 8;
    const TRAIL = 3;
    let frame = 0;
    const CHARS_RING  = '◦○◎●◎○◦·';
    const CHARS_TRAIL = ['▓','▒','░'];
    function tick() {
        frame++;
        const W = 15, H = 9;
        const grid = Array(H).fill(null).map(() => Array(W).fill(' '));

        // Faint ring
        for (let t = 0; t < RING; t++) {
            const a = (t / RING) * Math.PI * 2;
            const x = Math.round(CX + Math.cos(a) * RX);
            const y = Math.round(CY + Math.sin(a) * RY);
            if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = '·';
        }

        // Orbiting head + trail
        const headIdx = frame % RING;
        for (let t = 0; t < TRAIL + 1; t++) {
            const idx = ((headIdx - t) + RING * 10) % RING;
            const a   = (idx / RING) * Math.PI * 2;
            const x   = Math.round(CX + Math.cos(a) * RX);
            const y   = Math.round(CY + Math.sin(a) * RY);
            if (x >= 0 && x < W && y >= 0 && y < H) {
                grid[y][x] = t === 0 ? '●' : CHARS_TRAIL[t - 1] || '·';
            }
        }

        // Centre
        grid[CY][CX] = '+';

        const lines = grid.map(row => row.join(''));
        const spin  = ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'][frame % 10];
        el.textContent = lines.join('\n') + '\n  ' + spin + '  ORBITING';
    }
    setInterval(tick, 70);
    tick();
})();

// ─── 6. SIGNAL CASCADE (matrix rain) ────────────────────────────
(function() {
    const el = document.getElementById('a6');
    const COLS = 14, ROWS = 8;
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#!%&アイウエオカキクケコ';
    // Each cell: { c, age }  age=0 bright, increases → fades → empty
    const grid = Array(ROWS).fill(null).map(() =>
        Array(COLS).fill(null).map(() => ({ c: ' ', age: 99 }))
    );
    const drops = Array(COLS).fill(0).map(() => ({
        y: -Math.floor(Math.random() * ROWS),
        speed: 0.2 + Math.random() * 0.3,
    }));

    function rndChar() { return CHARS[Math.floor(Math.random() * CHARS.length)]; }

    function tick() {
        // Age all cells
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const cell = grid[r][c];
                cell.age++;
                if (cell.age > 12) cell.c = ' ';
                // Random mutation while alive
                if (cell.age < 12 && Math.random() > 0.85) cell.c = rndChar();
            }
        }
        // Advance drops
        for (let c = 0; c < COLS; c++) {
            drops[c].y += drops[c].speed;
            const r = Math.floor(drops[c].y);
            if (r >= 0 && r < ROWS) {
                grid[r][c] = { c: rndChar(), age: 0 };
            }
            if (drops[c].y >= ROWS + 3) {
                drops[c].y = -Math.floor(Math.random() * 4);
                drops[c].speed = 0.2 + Math.random() * 0.3;
            }
        }
        // Render — bright (age 0-2) vs dim (age 3-11)
        let html = '';
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                const { ch, age } = { ch: grid[r][c].c, age: grid[r][c].age };
                if (ch === ' ') { html += ' '; continue; }
                const bright = age <= 2;
                const style  = bright
                    ? 'color:#ffffff;text-shadow:0 0 8px rgba(0,255,65,1)'
                    : 'color:#00b32c;text-shadow:0 0 3px rgba(0,255,65,.4)';
                html += `<span style="${style}">${ch}</span>`;
            }
            html += '\n';
        }
        el.innerHTML = html;
    }
    setInterval(tick, 55);
    tick();
})();

// ─── 7. RADAR SWEEP ─────────────────────────────────────────────
(function() {
    const el = document.getElementById('a7');
    const W = 17, H = 9;
    const CX = 8, CY = 4;
    const RX = 7, RY = 3.5;
    let angle = 0;
    const blips = []; // { a, r, life }

    function tick() {
        angle += 0.12;

        // Occasionally plant a blip
        if (Math.random() > 0.93) {
            blips.push({
                a: Math.random() * Math.PI * 2,
                r: 0.3 + Math.random() * 0.6,
                life: 18,
            });
        }
        blips.forEach(b => b.life--);
        // Remove dead blips
        while (blips.length > 0 && blips[0].life <= 0) blips.shift();

        const grid = Array(H).fill(null).map(() => Array(W).fill(' '));

        // Faint ring border
        for (let t = 0; t < 64; t++) {
            const a = (t / 64) * Math.PI * 2;
            const x = Math.round(CX + Math.cos(a) * RX);
            const y = Math.round(CY + Math.sin(a) * RY);
            if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = '·';
        }
        // Crosshair
        grid[CY][CX] = '+';
        if (CX - 3 >= 0)  grid[CY][CX - 3] = '─';
        if (CX - 2 >= 0)  grid[CY][CX - 2] = '─';
        if (CX + 2 < W)   grid[CY][CX + 2] = '─';
        if (CX + 3 < W)   grid[CY][CX + 3] = '─';
        if (CY - 1 >= 0)  grid[CY - 1][CX] = '│';
        if (CY + 1 < H)   grid[CY + 1][CX] = '│';

        // Sweep arm
        for (let r = 1; r <= Math.max(RX, RY); r++) {
            const x = Math.round(CX + Math.cos(angle) * r * (RX / Math.max(RX, RY)));
            const y = Math.round(CY + Math.sin(angle) * r * (RY / Math.max(RX, RY)));
            if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = '▓';
        }

        // Blips
        blips.forEach(b => {
            const x = Math.round(CX + Math.cos(b.a) * b.r * RX);
            const y = Math.round(CY + Math.sin(b.a) * b.r * RY);
            if (x >= 0 && x < W && y >= 0 && y < H)
                grid[y][x] = b.life > 10 ? '◉' : b.life > 5 ? '○' : '·';
        });

        el.textContent = grid.map(row => row.join('')).join('\n') +
            '\n  SWEEP · ' + (Math.round(angle * 180 / Math.PI) % 360) + '°';
    }
    setInterval(tick, 65);
    tick();
})();

// ─── 8. PULSE RINGS ─────────────────────────────────────────────
(function() {
    const el = document.getElementById('a8');
    // Three rings at different phases, expanding outward, fading
    const MAX_R  = 5;
    const CX = 9, CY = 4, W = 19, H = 9;
    const RING_CHARS = ['█', '▓', '▒', '░', '·', ' '];
    let t = 0;

    // Draw a ring of given radius on a char grid
    function drawRing(grid, cx, cy, r, char) {
        const steps = Math.max(4, Math.round(r * Math.PI * 3));
        for (let i = 0; i < steps; i++) {
            const a = (i / steps) * Math.PI * 2;
            const x = Math.round(cx + Math.cos(a) * r * 1.8); // wider x for char aspect
            const y = Math.round(cy + Math.sin(a) * r * 0.85);
            if (x >= 0 && x < W && y >= 0 && y < H) grid[y][x] = char;
        }
    }

    function tick() {
        t++;
        const grid = Array(H).fill(null).map(() => Array(W).fill(' '));

        // Three offset rings
        for (let wave = 0; wave < 3; wave++) {
            const phase = (t + wave * 14) % (MAX_R * 8);
            const r     = (phase / (MAX_R * 8)) * MAX_R;
            const age   = Math.floor((phase / (MAX_R * 8)) * RING_CHARS.length);
            const ch    = RING_CHARS[Math.min(age, RING_CHARS.length - 1)];
            if (ch !== ' ' && r > 0) drawRing(grid, CX, CY, r, ch);
        }

        // Pulsing centre
        const beatChars = ['◉','●','◎','○','·'];
        const beat      = beatChars[Math.floor(t / 4) % beatChars.length];
        grid[CY][CX]    = beat;

        el.textContent = grid.map(row => row.join('')).join('\n') + '\n      PULSE';
    }
    setInterval(tick, 55);
    tick();
})();
</script>
</body>
</html>
